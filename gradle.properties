# ---------------------------------------------------------------------------
# SmartSkip — Gradle properties
# ---------------------------------------------------------------------------

# --- JVM / daemon ----------------------------------------------------------
# Gradle 9 + AGP 9 need a fair amount of heap for Kotlin compilation.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# --- Kotlin ----------------------------------------------------------------
kotlin.code.style=official

# --- AndroidX --------------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true

# Keep resource shrinking off for debug-only work; release config lives in the app module.
android.enableJetifier=false

# --- AGP 9 built-in Kotlin + KSP interop -----------------------------------
# AGP 9 owns Kotlin compilation ("built-in Kotlin") and by default forbids other
# plugins from registering Kotlin source sets. KSP — which Room's annotation
# processor needs — still registers its generated sources through the Kotlin
# source-set DSL, so without this flag configuration fails with:
#   "Using kotlin.sourceSets DSL to add Kotlin sources is not allowed with
#    built-in Kotlin."
# This is the escape hatch AGP itself points at. It is a documented interop
# accommodation, not a workaround for a mistake in this project; revisit once
# KSP registers generated sources through the android.sourceSets DSL.
android.disallowKotlinSourceSets=false
